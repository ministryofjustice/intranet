name: Deploy to MoJ Cloud Platform

on:
  workflow_dispatch:
  push:
    branches:
      - 'demo'
      - 'dev'
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  image:
    name: "Image"
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
    with:
      pipeline: ${{ github.ref_name }}

  get_ip_ranges:
    name: "IP Ranges"
    uses: ./.github/workflows/ip-ranges-configure.yml
    permissions:
      contents: read
    secrets: inherit

  deploy_dev:
    name: "Development"
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/deploy.yml
    needs: [image, get_ip_ranges]
    with:
      environment: development
      registry: ${{ needs.image.outputs.registry }}
      ips_formatted: ${{ needs.get_ip_ranges.outputs.ips_formatted }}
      pipeline: dev
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  deploy_demo:
    name: "Demo"
    if: github.ref_name == 'demo'
    uses: ./.github/workflows/deploy.yml
    needs: [image, get_ip_ranges]
    with:
      environment: demo
      registry: ${{ needs.image.outputs.registry }}
      ips_formatted: ${{ needs.get_ip_ranges.outputs.ips_formatted }}
      pipeline: demo
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  deploy_staging:
    name: "Staging"
    needs: [image, get_ip_ranges]
    if: github.ref_name == 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      registry: ${{ needs.image.outputs.registry }}
      ips_formatted: ${{ needs.get_ip_ranges.outputs.ips_formatted }}
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  deploy_production:
    name: "Production"
    needs: [image, deploy_staging, get_ip_ranges]
    if: github.ref_name == 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      registry: ${{ needs.image.outputs.registry }}
      ips_formatted: ${{ needs.get_ip_ranges.outputs.ips_formatted }}
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
