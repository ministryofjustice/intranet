name: "CI Build"

on:
  workflow_call:
    outputs:
      registry:
        description: "AWS registry where the ECR is located"
        value: ${{ jobs.image_build.outputs.registry }}
    inputs:
      pipeline:
        description: 'Define the pipeline in use. One of main or demo, dev, or main'
        default: 'main'
        type: string

jobs:
  image_build:
    name: "Build"
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Configuring AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: "Logging into ECR"
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        id: ecr-login

      - name: "Build & Push to ECR"
        run: |
          
          # ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░
               
          docker image build \
            -t $REGISTRY/$REPOSITORY:fpm-$PIPELINE_TAG-$IMAGE_TAG \
            --build-arg ACF_PRO_LICENSE="$ACF_PRO_LICENSE" --build-arg ACF_PRO_PASS="$ACF_PRO_PASS"     \
            --build-arg AS3CF_PRO_USER="$AS3CF_PRO_USER"   --build-arg AS3CF_PRO_PASS="$AS3CF_PRO_PASS" \
            --build-arg IMAGE_TAG="$IMAGE_TAG" \
            --target build-fpm .
          
          docker image build \
            -t $REGISTRY/$REPOSITORY:nginx-$PIPELINE_TAG-$IMAGE_TAG \
            --build-arg ACF_PRO_LICENSE="$ACF_PRO_LICENSE" --build-arg ACF_PRO_PASS="$ACF_PRO_PASS"     \
            --build-arg AS3CF_PRO_USER="$AS3CF_PRO_USER"   --build-arg AS3CF_PRO_PASS="$AS3CF_PRO_PASS" \
            --target build-nginx .

          # ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░

          docker image push $REGISTRY/$REPOSITORY:fpm-$PIPELINE_TAG-$IMAGE_TAG
          docker image push $REGISTRY/$REPOSITORY:nginx-$PIPELINE_TAG-$IMAGE_TAG

          # ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░  ░░

        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          PIPELINE_TAG: ${{ inputs.pipeline }}
          ACF_PRO_LICENSE: ${{ secrets.ACF_PRO_LICENSE }}
          ACF_PRO_PASS: ${{ secrets.ACF_PRO_PASS }}
          AS3CF_PRO_USER: ${{ secrets.AS3CF_PRO_USER }}
          AS3CF_PRO_PASS: ${{ secrets.AS3CF_PRO_PASS }}

      # The assets are pushed to s3 by the deploy workflow, which needs them on the runner.
      # Extracted from a scratch image rather than exported with buildx, so that the build
      # shares the daemon's layer cache with the fpm & nginx builds above.
      - name: "Export s3 assets"
        run: |

          docker image build \
            -t intranet-s3-assets:$IMAGE_TAG \
            --build-arg ACF_PRO_LICENSE="$ACF_PRO_LICENSE" --build-arg ACF_PRO_PASS="$ACF_PRO_PASS"     \
            --build-arg AS3CF_PRO_USER="$AS3CF_PRO_USER"   --build-arg AS3CF_PRO_PASS="$AS3CF_PRO_PASS" \
            --target build-s3-assets .

          mkdir -p "$RUNNER_TEMP/s3-assets"

          ## `docker create` rejects an image with no command, so pass one. It is never run.
          CID=$(docker create intranet-s3-assets:$IMAGE_TAG /noop)
          trap 'docker rm "$CID" > /dev/null 2>&1 || true' EXIT

          ## Nb. no `-a`, so the uid 101 files from vendor-assets land owned by the runner.
          docker cp "$CID:/assets/." "$RUNNER_TEMP/s3-assets/"

          echo "Exported $(find "$RUNNER_TEMP/s3-assets/public" -type f | wc -l) files."

          ## Tar before upload - actions/upload-artifact skips hidden files by default,
          ## and some vendor assets are dotfiles.
          tar -C "$RUNNER_TEMP/s3-assets" -cf "$RUNNER_TEMP/s3-assets.tar" .

        env:
          IMAGE_TAG: ${{ github.sha }}
          ACF_PRO_LICENSE: ${{ secrets.ACF_PRO_LICENSE }}
          ACF_PRO_PASS: ${{ secrets.ACF_PRO_PASS }}
          AS3CF_PRO_USER: ${{ secrets.AS3CF_PRO_USER }}
          AS3CF_PRO_PASS: ${{ secrets.AS3CF_PRO_PASS }}

      ## Downloaded by deploy.yml - keep the artifact name in step with that workflow.
      - name: "Upload s3 assets"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-assets
          path: ${{ runner.temp }}/s3-assets.tar
          ## Artifacts outlive the run, so a re-run would otherwise fail on a name clash.
          overwrite: true
          if-no-files-found: error
          retention-days: 7
