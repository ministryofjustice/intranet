name: "Sync branch with main"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to bring in line with main"
        required: true
        type: choice
        options:
          - dev
          - demo

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  open_sync_pr:
    name: "Open PR: main -> ${{ inputs.target }}"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Create or update PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ inputs.target }}
        run: |
          HEAD="main"
          SYNC_BRANCH="chore/sync-${BASE}-with-main"

          # Bail out if the target already matches main exactly.
          if git diff --quiet "origin/${BASE}" "origin/${HEAD}"; then
            echo "${BASE} already matches main - nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build a branch that sits on top of the target but whose tree is
          # exactly main's. Merging it makes the target identical to main,
          # regardless of the merge strategy used.
          git checkout -B "$SYNC_BRANCH" "origin/${BASE}"
          git read-tree -m -u "origin/${HEAD}"
          git commit -m "Sync ${BASE} with main"
          git push --force origin "$SYNC_BRANCH"

          # Reuse the existing PR if one is already open (the force-push
          # above already updated it); otherwise open a new one.
          EXISTING=$(gh pr list --base "$BASE" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            URL="${{ github.server_url }}/${{ github.repository }}/pull/${EXISTING}"
            echo "PR already open: ${URL}"
          else
            URL=$(gh pr create \
              --base "$BASE" \
              --head "$SYNC_BRANCH" \
              --title "Sync ${BASE} with main" \
              --body "Automated PR to bring \`${BASE}\` in line with \`main\`. Merging this makes \`${BASE}\` identical to \`main\`. Triggered manually via the *Sync branch with main* workflow.")
            echo "Opened PR: ${URL}"
          fi

          echo "${URL}" >> "$GITHUB_STEP_SUMMARY"
