name: "PoC: eMudhra CA trust on hosted runners"

# Temporary proof of concept - delete this file and branch once done.
# Shows whether GitHub-hosted Ubuntu runners trust the compromised eMudhra
# intermediates, and whether upgrading ca-certificates fixes it.
# Test hosts: https://emudhra.we-have-a-problem.com/#users
# Every check appends to a results table; the last step prints it and adds it to the run summary.

on:
  push:
    branches:
      - 'poc/emudhra-runner-trust'

permissions: {}

jobs:
  check:
    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'ubuntu-26.04']
    env:
      HOSTS: "dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com"
      RESULTS: /tmp/emudhra-results.md
      CHECK_SH: /tmp/emudhra-check.sh

    steps:
      # Same PHP/Composer setup as php-composer-test.yml.
      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: "Set up checks"
        run: |
          cat > "$CHECK_SH" <<'SH'
          NODE_CHECK='for (const h of process.argv.slice(1)) {
            try { const r = await fetch(`https://${h}/`); console.log(`${h}|TRUSTED (HTTP ${r.status})`); }
            catch (e) { console.log(`${h}|REJECTED (${e.cause?.code ?? e.message})`); }
          }'

          # record <phase> <client> <host> <result>
          record() {
            case "$4" in
              TRUSTED*) verdict="❌ vulnerable" ;;
              REJECTED*) verdict="✅ safe" ;;
              *) verdict="⚠️ inconclusive" ;;
            esac
            echo "| $1 | $2 | ${3%%.*} | $4 | $verdict |" >> "$RESULTS"
            echo "$1 / $2 / $3: $4"
          }

          # check_curl <phase>
          check_curl() {
            for h in $HOSTS; do
              if curl -sS -o /dev/null --max-time 15 "https://$h/" 2>/dev/null; then
                record "$1" "curl" "$h" "TRUSTED"
              else
                record "$1" "curl" "$h" "REJECTED (curl exit $?)"
              fi
            done
          }

          # check_node <phase> <label> <node binary> [node flags...]
          check_node() {
            phase=$1 label=$2 bin=$3; shift 3
            "$bin" "$@" --input-type=module -e "$NODE_CHECK" $HOSTS | while IFS='|' read -r h result; do
              record "$phase" "$label" "$h" "$result"
            done
          }

          # check_composer <phase>
          # Points a throwaway project at a composer repository on each test host. A TLS failure
          # means the cert was rejected; any HTTP-level response (404, unparseable packages.json)
          # means the TLS handshake succeeded, i.e. the cert was trusted.
          check_composer() {
            for h in $HOSTS; do
              d=$(mktemp -d)
              printf '{"repositories":[{"type":"composer","url":"https://%s"},{"packagist.org":false}],"require":{"poc/emudhra-check":"*"}}' "$h" > "$d/composer.json"
              out=$(cd "$d" && COMPOSER_HOME="$d/home" composer update --dry-run --no-interaction 2>&1 || true)
              reason=$(echo "$out" | grep -oiE "curl error [0-9]+|SSL certificate problem: [a-z ]+|HTTP/[0-9.]+ [0-9]+|could not be (parsed|downloaded)" | head -1)
              if echo "$out" | grep -qiE "certificate|ssl|curl error 60"; then
                record "$1" "composer" "$h" "REJECTED ($reason)"
              elif echo "$out" | grep -qiE "packages.json|HTTP/"; then
                record "$1" "composer" "$h" "TRUSTED ($reason)"
              else
                record "$1" "composer" "$h" "ERROR ($(echo "$out" | grep -m1 -v '^\s*$' | sed 's/|/ /g' | cut -c1-110))"
              fi
            done
          }

          runner_nodes() { find / -path "*/externals/node*/bin/node" 2>/dev/null; }
          SH

          {
            echo "## ${{ matrix.os }}"
            echo
            echo "- Image: \`$ImageOS $ImageVersion\`"
            echo "- ca-certificates (before): \`$(dpkg-query -W -f='${Version}' ca-certificates)\`"
            echo "- System node: \`$(node -v)\`"
            echo "- PHP: \`$(php -r 'echo PHP_VERSION;')\`, $(composer --version 2>/dev/null | head -1)"
            echo "- PHP openssl default cafile: \`$(php -r 'echo openssl_get_cert_locations()["default_cert_file"];')\`"
            . "$CHECK_SH"
            for n in $(runner_nodes); do echo "- Runner's bundled node: \`$n\` \`$($n -v)\`"; done
            echo
            echo "| Phase | Client | Host | Result | Verdict |"
            echo "|---|---|---|---|---|"
          } > "$RESULTS"
          cat "$RESULTS"

      - name: "Before: curl (system store)"
        run: . "$CHECK_SH" && check_curl "1 before"

      - name: "Before: composer (as in php-composer-test.yml)"
        run: . "$CHECK_SH" && check_composer "1 before"

      - name: "Before: Node (bundled store)"
        run: . "$CHECK_SH" && check_node "1 before" "node" "$(command -v node)"

      - name: "Before: Actions runner's bundled Node (used by JS actions)"
        run: |
          . "$CHECK_SH"
          for n in $(runner_nodes); do check_node "1 before" "runner $($n -v)" "$n"; done

      - name: "Upgrade ca-certificates"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --only-upgrade ca-certificates
          echo "| 2 upgrade | apt | — | ca-certificates now \`$(dpkg-query -W -f='${Version}' ca-certificates)\` | |" >> "$RESULTS"

      - name: "After: curl (system store)"
        run: . "$CHECK_SH" && check_curl "3 after"

      - name: "After: composer"
        run: . "$CHECK_SH" && check_composer "3 after"

      - name: "After: Node bundled store (expected unchanged)"
        run: . "$CHECK_SH" && check_node "3 after" "node" "$(command -v node)"

      - name: "After: Node with --use-system-ca"
        run: . "$CHECK_SH" && check_node "3 after" "node --use-system-ca" "$(command -v node)" --use-system-ca

      - name: "After: Node with --use-openssl-ca (system store only)"
        run: . "$CHECK_SH" && check_node "3 after" "node --use-openssl-ca" "$(command -v node)" --use-openssl-ca
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      - name: "After: Actions runner's bundled Node with --use-openssl-ca"
        run: |
          . "$CHECK_SH"
          for n in $(runner_nodes); do check_node "3 after" "runner $($n -v) --use-openssl-ca" "$n" --use-openssl-ca; done
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      - name: "Results"
        if: always()
        run: |
          cat "$RESULTS"
          cat "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
