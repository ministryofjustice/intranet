[www]
user = nginx;
group = nginx;

listen = /sock/fpm.sock;
listen.owner = nginx;
listen.group = nginx;
listen.mode = 0660;

ping.path = /ping
ping.response = pong

pm = dynamic;
pm.start_servers = 10;
pm.min_spare_servers = 5;
pm.max_spare_servers = 20;
pm.max_requests = 500;
pm.max_children = 20;
pm.status_path = /status;

; Log a stack trace to stderr for slow queries.
request_slowlog_timeout = 10s;
slowlog = /proc/self/fd/2;

; Errors are logged to stderr, never shown on the page. These are locked with
; php_admin so ini_set() cannot change them. error_reporting cannot be locked
; this way, because the error_reporting() function ignores php_admin, so
; config/application.php sets it again after WordPress has narrowed it.
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[error_reporting] = E_ALL

; Request limits, mitigating CVE-2026-109618 (RCE via OOM during request
; parsing): no PHP memory limit to hit, and a small request body. Locked with
; php_admin so ini_set() and WordPress can't put a finite memory limit back.
; The container's memory limit is the boundary instead.
php_admin_value[memory_limit] = -1
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 30M
; Input parser limits. The deepest real form input is 5 levels, an ACF
; flexible content row holding a repeater (acf[field][row][field][row][field]).
php_admin_value[max_input_vars] = 1000
php_admin_value[max_input_nesting_level] = 16
php_admin_value[max_multipart_body_parts] = 1020
; Not locked, because set_time_limit() has to be able to change it.
php_value[max_execution_time] = 300

[global]
log_buffering = false;
daemonize = no
emergency_restart_threshold = 10;
emergency_restart_interval = 1m;
process_control_timeout = 10s;
