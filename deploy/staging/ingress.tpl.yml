apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intranet-staging-ingress
  namespace: intranet-staging
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: intranet-staging-ingress-intranet-staging-green
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      ${MODSEC_CONFIG}
      # Block any request whose Content-Type mentions multipart (any method, any case), before the body is read.
      SecRule REQUEST_HEADERS:Content-Type "@contains multipart" "id:9001000,phase:1,deny,status:403,log,t:none,t:lowercase,ctl:ruleEngine=On,msg:multipart-request-blocked"
    nginx.ingress.kubernetes.io/proxy-body-size: "250m"
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        add_header Content-Type text/plain;
        return 200 "OK";
      }
      location = /.well-known/security.txt {
        auth_basic off;
        return 301 https://raw.githubusercontent.com/ministryofjustice/security-guidance/main/contact/vulnerability-disclosure-security.txt;
      }
      # Holding page: every request outside /.well-known/ is answered by the
      # ingress itself and never reaches WordPress. It sits first in the snippet,
      # so it also takes precedence over the host redirects and /bold below.
      # /.well-known/ is left alone for security.txt and cert-manager ACME
      # challenges. The HTML is one single-quoted nginx string, so it must not
      # contain a single quote, and every line must stay indented under the
      # server-snippet key or the YAML block ends early.
      if ($uri !~ ^/\.well-known/ && $uri != /__holding-page) {
        rewrite ^ /__holding-page last;
      }
      location = /__holding-page {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Error, service unavailable</title>
          </head>
          <body>
            <main style="max-width: 1000px;margin: 1rem auto;font-family: sans-serif;font-size: 1.2rem;">
              <h1>Thanks for visiting the Intranet</h1>
              <p>Unfortunately the Intranet is currently down following the major incident involving the technology PHP.</p>
              <p>Our platform team is working on putting the appropriate protections in place and hope to have the intranet back up ASAP.</p>
              <ul>
                <li><a href="https://app.matrixbooking.com/login/">Room booking</a></li>
                <li><a href="https://ccsportal.ctmnorth.co.uk">Travel Booking</a></li>
                <li><a href="https://moj.myhub.sscl.com/">MyHub/SOP</a></li>
                <li><a href="https://mojprod.service-now.com/moj_sp">Technology Portal</a></li>
              </ul>
            </main>
          </body>
        </html>
        ';
      }
spec:
  ingressClassName: modsec-non-prod
  tls:
  - hosts:
    - staging.intranet.justice.gov.uk
    secretName: intranet-staging-cert-secret
  rules:
  - host: staging.intranet.justice.gov.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 8080
